# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

format = """$os\
$username\
$hostname\
$localip\
$shlvl\
$singularity\
$kubernetes\
$directory\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
${custom.github_pr}\
$all\
$fill\
$time\
$line_break\
$jobs\
$battery\
$status\
$container\
$shell\
$character"""

#right_format = """$time"""

[os]
disabled = false
style = 'dimmed'

[time]
disabled = false
format = '[$time]($style) '
time_format = '%T'
style = 'dimmed'

[aws]
symbol = "  "

[buf]
symbol = " "

